services:
  db:
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_PASSWORD: oiweuhfi3wvcunskfkb
      POSTGRES_USER: thijstakens
      POSTGRES_DB: saas-starter-kit
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thijstakens -d saas-starter-kit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "4002:4002"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://thijstakens:oiweuhfi3wvcunskfkb@db:5432/saas-starter-kit
    volumes:
      - .:/app
      - /app/node_modules
